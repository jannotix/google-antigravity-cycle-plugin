name: release-candidate

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact branch, tag or SHA to certify
        required: true
        type: string
      run_500k:
        description: Run the resource-admitted 500k benchmark on an isolated Ubuntu runner
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  candidate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: prove exact checkout
        shell: bash
        run: |
          set -euo pipefail
          status="$(git status --porcelain)"
          test -z "$status" || { printf '%s\n' "$status" >&2; exit 1; }
          mkdir -p certification-artifacts
          git rev-parse HEAD | tee certification-artifacts/exact-sha.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 26.3.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run validate:contract
      - name: install Antigravity CLI on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://antigravity.google/cli/install.sh -o /tmp/install-agy.sh
          bash /tmp/install-agy.sh --dir "$RUNNER_TEMP/agy-bin"
          echo "$RUNNER_TEMP/agy-bin" >> "$GITHUB_PATH"
      - name: install Antigravity CLI on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest https://antigravity.google/cli/install.cmd -OutFile "$env:RUNNER_TEMP\install-agy.cmd"
          & cmd.exe /c "$env:RUNNER_TEMP\install-agy.cmd --skip-aliases --skip-path"
          "$env:LOCALAPPDATA\agy\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: native Antigravity plugin validation
        run: agy plugin validate .
      - run: node scripts/sbom.mjs --check
      - run: npm run repeat:critical
      - run: npm run package
      - run: npm run provenance
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: build/cycle-antigravity-*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate-${{ matrix.os }}
          path: |
            build/cycle-antigravity-*.zip
            build/cycle-antigravity-*.zip.sha256
            build/cycle-antigravity-*.provenance.json
            certification-artifacts/repeat-critical.json
            certification-artifacts/exact-sha.txt
          if-no-files-found: error

  benchmark-500k:
    if: ${{ inputs.run_500k }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 26.3.0
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node scripts/benchmark-500k.mjs --files 500000 --minimum-free-memory-gib 6 --minimum-free-disk-gib 15
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-500k
          path: certification-artifacts/benchmark-500k.json
          if-no-files-found: error
